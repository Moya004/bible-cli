[package]
name = "biblia-cli"
version = "0.1.0"
edition = "2024"

[features]
# Modo ventana (`--window`). Compila el backend de raylib, que construye raylib
# desde C y necesita cmake.
gui = ["dep:raylib"]

[dependencies]
array-deque = "0.3.1"
clay-layout = "0.4.0"
csv = "1.4.0"
raylib = { version = "5.5.0", optional = true }
regex = "1.12.3"
rusqlite = "0.39.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
termion = "4.0.6"
unicode-width = "0.2"
